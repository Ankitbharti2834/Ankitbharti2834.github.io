<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ankit Bharti — Portfolio</title>
<meta http-equiv="refresh" content="0; url=https://ankit-bharti-portfolio.vercel.app">
<meta name="description" content="Ankit Bharti — Data Analyst, BI Engineer, Game Developer. Redirecting to portfolio...">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060B18;color:#EEF2FF;font-family:'Outfit',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:1.5rem}
.logo{font-family:Georgia,serif;font-size:2.5rem;font-weight:700;color:#00E5D4}
.msg{font-size:.95rem;color:#94A3C4;letter-spacing:.05em}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#00E5D4;margin:0 3px;animation:bounce 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
a{color:#00E5D4;text-decoration:none;font-size:.85rem;margin-top:.5rem;opacity:.7}
a:hover{opacity:1}
</style>
</head>
<body>
<script>window.location.replace("https://ankit-bharti-portfolio.vercel.app");</script>
<div class="logo">AB.</div>
<div class="msg">
  Redirecting to portfolio
  <span class="dot"></span>
  <span class="dot"></span>
  <span class="dot"></span>
</div>
<a href="https://ankit-bharti-portfolio.vercel.app">Click here if not redirected</a>
</body>
</html>
