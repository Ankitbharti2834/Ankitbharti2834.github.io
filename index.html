<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ankit Bharti — Redirecting...</title>
<meta http-equiv="refresh" content="0; url=https://ankitbharti-portfolio.vercel.app">
<script>window.location.replace("https://ankitbharti-portfolio.vercel.app");</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060B18;color:#EEF2FF;font-family:'Outfit',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:1.2rem}
.logo{font-family:Georgia,serif;font-size:2.8rem;font-weight:800;color:#00E5D4;letter-spacing:-.02em}
.msg{font-size:.9rem;color:#94A3C4;display:flex;align-items:center;gap:.5rem}
.dots{display:flex;gap:.3rem}
.dot{width:7px;height:7px;border-radius:50%;background:#00E5D4;animation:bounce 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.3}40%{transform:scale(1);opacity:1}}
a{color:#00E5D4;font-size:.8rem;opacity:.6;text-decoration:none;margin-top:.5rem}
a:hover{opacity:1}
</style>
</head>
<body>
<div class="logo">AB.</div>
<div class="msg">
  Redirecting to portfolio
  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</div>
<a href="https://ankitbharti-portfolio.vercel.app">Click here if not redirected</a>
</body>
</html>
